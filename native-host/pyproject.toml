[project]
name = "media-downloader-host"
version = "0.2.0"
description = "Native messaging host for the Media Downloader extension: downloads direct media files, or delegates page URLs to yt-dlp (never DRM-protected streams)."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "yt-dlp>=2024.12.13",
    "cryptography>=43.0",
]

[project.scripts]
media-downloader-host = "media_downloader.host:main"
media-downloader = "media_downloader.cli:main"
media-downloader-decrypt = "media_downloader.cli:decrypt_main"
media-downloader-serve = "media_downloader.server:main"
media-downloader-playlist = "media_downloader.cli:playlist_main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["media_downloader"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "yt_dlp.*"
ignore_missing_imports = true
