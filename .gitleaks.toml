# Minimal gitleaks config — extends the tool's built-in default ruleset
# (https://github.com/gitleaks/gitleaks) rather than redefining rules.
#
# If a real finding is a false positive specific to this repo (a fixture, a doc
# example), add it here rather than disabling the scan:
#
# [[rules.allowlist]]
#   regexes = ['''EXAMPLE_PLACEHOLDER_ONLY''']
#   paths = ['''docs/examples/.*''']

[extend]
useDefault = true

# The Chromium manifest's "key" field is the extension's PUBLIC key (base64
# SPKI) — committed on purpose to pin the extension ID so the native
# messaging host can be registered against a stable ID. It's distributed to
# every browser that installs the extension; there is nothing secret in it.
[allowlist]
paths = [
  '''extension/manifest\.chrome\.json''',
  '''extension/dist/.*/manifest\.json''',
]
