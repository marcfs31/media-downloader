<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Media Downloader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="mdlx-popup">
      <h1>Media Downloader</h1>

      <section class="mdlx-section">
        <label for="mdlx-url-input">Download a link</label>
        <div class="mdlx-row">
          <input id="mdlx-url-input" type="url" placeholder="https://example.com/video.mp4" />
          <button id="mdlx-url-submit" type="button">Download</button>
        </div>
        <p id="mdlx-status" class="mdlx-status" hidden></p>
      </section>

      <section class="mdlx-section">
        <h2>Detected on this page</h2>
        <ul id="mdlx-media-list" class="mdlx-media-list">
          <li class="mdlx-empty">Scanning…</li>
        </ul>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
